<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat - SweetMatch</title>
</head>
<body>
    <h1>Test del Chat de SweetMatch</h1>
    <p>Esta página redirige automáticamente al chat para probar la funcionalidad.</p>
    
    <script>
        // Crear un usuario de prueba en sessionStorage
        const testUser = {
            id: 1,
            nombre: 'Usuario de Prueba',
            email: 'test@sweetmatch.com',
            perfil_completado: true
        };
        
        // Guardar en sessionStorage
        sessionStorage.setItem('current_user', JSON.stringify(testUser));
        sessionStorage.setItem('auth_token', 'test_token_123');
        
        // Redirigir al chat después de un breve delay
        setTimeout(() => {
            window.location.href = 'http://localhost:3000/#/chat';
        }, 1000);
    </script>
    
    <p>Si no se redirige automáticamente, <a href="http://localhost:3000/#/chat">haz clic aquí</a></p>
</body>
</html>
